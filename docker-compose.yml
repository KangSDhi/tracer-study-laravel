name: tracer-study-services

services:

    db:
        image: mariadb:10.5.15
        container_name: tracer-study-service-db
        ports:
            - "3306:3306"
        environment:
            MARIADB_ROOT_PASSWORD: "toor"
            MARIADB_USER: "lara"
            MARIADB_PASSWORD: "lara"
            MARIADB_DATABASE: "tracer-study-db"
        volumes:
            - "tracer-study-service-db-data:/var/lib/mysql"
        healthcheck:
            test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u$$MARIADB_USER -p$$MARIADB_PASSWORD | grep 'mysqld is alive'" ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 20s
        networks:
            - tracer-study-service-net

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: tracer-study-service-phpmyadmin
        ports:
            - "8081:80"
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
            PMA_USER: lara
            PMA_PASSWORD: lara
        depends_on:
            db:
                condition: service_healthy
        networks:
            - tracer-study-service-net

volumes:
    tracer-study-service-db-data:
        driver: local

networks:
    tracer-study-service-net:
        driver: bridge
